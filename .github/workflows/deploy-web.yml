name: Deploy web

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rock_ht-web

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      image-selfhost: ${{ steps.meta-selfhost.outputs.tags }}
      digest-selfhost: ${{ steps.push-selfhost.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      # Without the Supabase secrets the image is still built: it is the self-hosted sync server
      # (docker-compose.selfhost.yml), with web login disabled.
      - name: Note missing Supabase config
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice title=Web image without Supabase::NEXT_PUBLIC_SUPABASE_URL/ANON_KEY are not set. The image serves the marketing pages, /api/auth and /api/sync (self-host); web login is disabled."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same image, same Dockerfile, but built with NO Supabase build-args at all (not even empty
      # ones), so it never bakes a stale/placeholder Supabase URL into the client bundle. This is the
      # image docker-compose.selfhost.yml pulls: web login stays disabled, only /api/auth (Better
      # Auth) and /api/sync serve requests. Tags get a "selfhost" / "selfhost-<version>" /
      # "selfhost-sha-<hash>" naming so both variants can live in the same GHCR package.
      - name: Extract self-host image metadata
        id: meta-selfhost
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=selfhost-latest,enable={{is_default_branch}}
            type=semver,pattern=selfhost-{{version}}
            type=semver,pattern=selfhost-{{major}}.{{minor}}
            type=sha,prefix=selfhost-sha-,format=short
          # Without this, metadata-action's default flavor (`latest=auto`) adds a bare, unprefixed
          # "latest" tag whenever a `v*` semver tag is pushed — which would retag the Supabase
          # image's `:latest` (set explicitly by the step above) with this self-host build. Every
          # tag here is already explicit (selfhost-latest / selfhost-<version> / selfhost-sha-<hash>),
          # so disabling the auto tag changes nothing else.
          flavor: |
            latest=false

      - name: Build and push (self-host, no Supabase build-args)
        id: push-selfhost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-selfhost.outputs.tags }}
          labels: ${{ steps.meta-selfhost.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Optional: uncomment and configure for your hosting platform ────────────
