# Self-hosted sync server for the rock mobile app: Postgres + the web image (Better Auth at /api/auth,
# sync at /api/sync). No Supabase: the web UI only shows the landing page, web login is disabled.
#
#   cp .env.selfhost.example .env.selfhost   # then edit the values
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d
#
# In the app: Settings → Sync → Self-hosted → PUBLIC_URL. The schema in db/selfhost/init is loaded only
# when the pgdata volume is first created.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rock_ht
      POSTGRES_USER: rock_ht
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/selfhost/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rock_ht -d rock_ht"]
      interval: 5s
      retries: 10

  web:
    # The self-host variant (built without NEXT_PUBLIC_SUPABASE_* — see .github/workflows/deploy-web.yml),
    # not the Supabase-configured `:latest`/`:<version>` image. ROCK_HT_VERSION is the bit after
    # "selfhost-": "latest" (default) or a released version without its leading "v" (e.g. "1.2.0" for
    # tag v1.2.0), matching the tags docker/metadata-action produces for the selfhost image.
    image: ghcr.io/13/rock_ht-web:selfhost-${ROCK_HT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://rock_ht:${POSTGRES_PASSWORD}@db:5432/rock_ht
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      # WEB_BIND defaults to all interfaces. Behind a reverse proxy (nginx, Caddy — see README), set
      # WEB_BIND=127.0.0.1 so only the proxy, not the whole network, can reach the container directly.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
